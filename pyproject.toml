[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SSLimPy"
version = "0.1.0"
description = "Single-dish Spectral Line intensity Mapping with Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.21",
  "scipy>=1.8",
  "astropy>=5.0",
  "numba>=0.56",
  "PyYAML>=6.0",
  "py3nj",
  "camb",
  "classy",
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4.0",
  "ipykernel>=6.0",
  "matplotlib>=3.5",
  "seaborn>=0.11",
  "niceplots",
  "GetDist>=1.4",
  "corner>=2.2",
  "colossus>=1.3",
  "nautilus-sampler",
]
dev = [
  "pytest>=7.0",
  "build>=1.0",
  "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/Sefa76/SSLimPy"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["SSLimPy*"]
namespaces = true

[tool.setuptools.package-data]
"SSLimPy.data" = ["*.yaml", "SFR_tables/*.dat", "SFR_tables/qf/*.dat"]
